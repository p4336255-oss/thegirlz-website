<style>
body {
margin: 0;
background-color: #050505;
/* Background Layering */
background-image:
radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
url('image.png'); /* Your repeating tags */
background-repeat: no-repeat, no-repeat, repeat;
background-size: cover, cover, 400px;
background-blend-mode: screen;
background-attachment: fixed;
color: #ffb6c1;
text-align: center;
font-family: 'Syne', sans-serif;
scroll-behavior: smooth;
overflow-x: hidden;
}

/* --- DECORATIVE SWIRLS --- */
.swirl-decor {
position: fixed;
width: 300px;
height: 300px;
background-image: url('image.png'); /* Using your swirl/tag image */
background-size: contain;
background-repeat: no-repeat;
pointer-events: none;
z-index: 500;
opacity: 0.6;
filter: drop-shadow(0 0 10px #ff00ff);
}
.top-left { top: -50px; left: -50px; transform: rotate(15deg); }
.top-right { top: -50px; right: -50px; transform: rotate(100deg); }
.bottom-left { bottom: -50px; left: -50px; transform: rotate(-80deg); }
.bottom-right { bottom: -50px; right: -50px; transform: rotate(190deg); }

/* --- SIDE MENU --- */
.side-nav {
height: 100%; width: 0; position: fixed; z-index: 2000;
top: 0; right: 0; background-color: rgba(0, 0, 0, 0.98);
border-left: 3px solid #ff00ff; overflow-x: hidden;
transition: 0.5s; padding-top: 60px; text-align: left;
}
.side-nav a {
padding: 15px 30px; text-decoration: none; font-size: 20px;
color: #fff; display: block; font-family: 'Orbitron', sans-serif;
transition: 0.3s; border-bottom: 1px solid #222;
}

/* --- TITLES --- */
.header-bar {
background: linear-gradient(90deg, #ff00ff, #00ffff);
padding: 12px; font-family: 'Orbitron', sans-serif;
font-size: 11px; color: #000; text-transform: uppercase;
letter-spacing: 5px; position: sticky; top: 0; z-index: 1000;
}

.brand-title-wrap { position: relative; display: inline-block; }

.brand-title {
font-family: 'Sedgwick Ave Display', cursive;
font-size: clamp(80px, 18vw, 160px);
color: #fff; margin-top: 100px; margin-bottom: 20px;
text-transform: uppercase; letter-spacing: 2px;
text-shadow: 0 0 10px #fff, 0 0 30px #ff00ff, 0 0 80px #ff00ff;
position: relative; z-index: 10;
}

/* Swirl behind the main title */
.title-swirl {
position: absolute; top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 120%; height: 120%;
background-image: url('image.png');
background-size: contain; background-repeat: no-repeat;
opacity: 0.4; z-index: 1; filter: hue-rotate(280deg);
}

.nav-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 80px; }
.tab {
padding: 12px 30px; border: 2px solid #ffb6c1; color: #ffb6c1;
text-decoration: none; font-family: 'Orbitron', sans-serif;
background: rgba(0,0,0,0.9); cursor: pointer; transition: 0.3s;
}

.section-container {
padding: 100px 20px; max-width: 1100px; margin: 0 auto 50px auto;
background: rgba(0,0,0,0.75); border-radius: 20px;
border: 1px solid rgba(255, 255, 255, 0.1);
position: relative; overflow: hidden;
}

.service-header {
font-family: 'Sedgwick Ave Display', cursive;
font-size: 70px; color: #fff; text-shadow: 0 0 20px #00ffff;
}

footer {
padding: 100px 20px; font-family: 'Orbitron', sans-serif;
font-size: 18px; color: #ffffff !important;
font-weight: bold; text-transform: uppercase;
letter-spacing: 5px; text-shadow: 0 0 15px #ff00ff;
}
</style>
