<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>thegirlz.inc | Official</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Syne:wght@800&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
background-color: #050505;
/* LAYER 1: The Swirls everywhere */
background-image:
url('image.png'),
radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.2), transparent),
url('https://www.transparenttextures.com/patterns/stardust.png');
background-repeat: repeat;
background-size: 500px, cover, auto;
background-blend-mode: lighten;
background-attachment: fixed;
color: #ffb6c1;
text-align: center;
font-family: 'Syne', sans-serif;
scroll-behavior: smooth;
}

/* BIG CORNER SWIRLS */
.corner-swirl {
position: fixed;
width: 400px;
height: 400px;
background-image: url('image.png');
background-size: contain;
background-repeat: no-repeat;
z-index: 999;
pointer-events: none;
filter: drop-shadow(0 0 15px #ff00ff) brightness(1.5);
}
.tl { top: -100px; left: -100px; transform: rotate(0deg); }
.tr { top: -100px; right: -100px; transform: rotate(90deg); }
.bl { bottom: -100px; left: -100px; transform: rotate(-90deg); }
.br { bottom: -100px; right: -100px; transform: rotate(180deg); }

.header-bar {
background: linear-gradient(90deg, #ff00ff, #00ffff);
padding: 10px;
font-family: 'Orbitron', sans-serif;
font-size: 11px;
color: #000;
letter-spacing: 5px;
position: sticky;
top: 0;
z-index: 2000;
}

.brand-title {
font-family: 'Sedgwick Ave Display', cursive;
font-size: clamp(80px, 20vw, 180px);
color: #fff;
margin-top: 120px;
text-transform: uppercase;
text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #fff;
position: relative;
z-index: 1001;
}

.nav-tabs {
display: flex;
justify-content: center;
gap: 15px;
margin-top: 20px;
position: relative;
z-index: 1001;
}

.tab {
padding: 12px 25px;
border: 2px solid #fff;
color: #fff;
text-decoration: none;
font-family: 'Orbitron', sans-serif;
background: #000;
cursor: pointer;
font-size: 14px;
}

.section-container {
padding: 100px 20px;
max-width: 1000px;
margin: 100px auto;
background: rgba(0, 0, 0, 0.85);
border: 2px solid #ff00ff;
position: relative;
z-index: 1001;
box-shadow: 0 0 50px rgba(255, 0, 255, 0.3);
}

footer {
padding: 100px;
color: #fff;
font-family: 'Orbitron';
font-size: 20px;
text-shadow: 0 0 10px #ff00ff;
}
</style>
</head>
<body>

<div class="corner-swirl tl"></div>
<div class="corner-swirl tr"></div>
<div class="corner-swirl bl"></div>
<div class="corner-swirl br"></div>

<div class="header-bar">THEGIRLZ.INC // SWIRL_MODE_ACTIVATED</div>

<h1 class="brand-title">THE GIRLZ</h1>

<nav class="nav-tabs">
<a href="#hair" class="tab">HAIR</a>
<a href="#nails" class="tab">NAILS</a>
<a href="#lashes" class="tab">LASHES</a>
</nav>

<div id="hair" class="section-container">
<h2 style="font-family:'Sedgwick Ave Display'; font-size: 60px;">HAIR</h2>
<p>PORTFOLIO LOADING...</p>
</div>

<div id="nails" class="section-container">
<h2 style="font-family:'Sedgwick Ave Display'; font-size: 60px;">NAILS</h2>
<p>PORTFOLIO LOADING...</p>
</div>

<footer>
★ ALL RIGHTS RESERVED // THEGIRLZ.INC ★
</footer>

</body>
</html>
