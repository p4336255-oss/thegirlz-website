
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>thegirlz.inc | Official</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Syne:wght@800&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
background-color: #050505;
/* Background Layers: 1. Your Swirls, 2. Stars, 3. Neon Glows */
background-image:
url('image.png'),
url('https://www.transparenttextures.com/patterns/stardust.png'),
radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15) 0%, transparent 50%);
background-repeat: repeat;
background-size: 400px, auto, cover, cover;
background-blend-mode: lighten;
background-attachment: fixed;
color: #ffb6c1;
text-align: center;
font-family: 'Syne', sans-serif;
scroll-behavior: smooth;
overflow-x: hidden;
}

/* --- DOODLE ELEMENTS --- */
.doodle {
position: fixed;
font-family: 'Sedgwick Ave Display', cursive;
font-size: 50px;
color: #ff00ff;
text-shadow: 0 0 15px #ff00ff;
pointer-events: none;
z-index: 1500;
opacity: 0.8;
filter: blur(0.3px);
}
.heart-top { top: 10%; left: 5%; transform: rotate(-20deg); }
.smile-bottom { bottom: 10%; right: 5%; transform: rotate(15deg); }
.star-mid { top: 40%; right: 10%; font-size: 30px; color: #00ffff; text-shadow: 0 0 10px #00ffff; }
.heart-mid { bottom: 30%; left: 8%; transform: rotate(10deg); font-size: 35px; }

/* Corner Swirls using your art */
.corner-swirl {
position: fixed;
width: 350px;
height: 350px;
background-image: url('image.png');
background-size: contain;
background-repeat: no-repeat;
z-index: 1400;
pointer-events: none;
filter: drop-shadow(0 0 10px #ff00ff) contrast(1.2);
}
.tl { top: -80px; left: -80px; transform: rotate(-15deg); }
.br { bottom: -80px; right: -80px; transform: rotate(165deg); }

/* --- TITLES & NAVIGATION --- */
.header-bar {
background: linear-gradient(90deg, #ff00ff, #00ffff);
padding: 10px; font-family: 'Orbitron', sans-serif;
font-size: 11px; color: #000; letter-spacing: 5px;
position: sticky; top: 0; z-index: 2000;
}

.brand-title {
font-family: 'Sedgwick Ave Display', cursive;
font-size: clamp(80px, 20vw, 180px);
color: #fff; margin-top: 100px;
text-transform: uppercase;
text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #fff;
position: relative; z-index: 1600;
}

.nav-tabs {
display: flex; justify-content: center; gap: 15px;
margin-top: -20px; position: relative; z-index: 1600;
}

.tab {
padding: 12px 25px; border: 2px solid #ffb6c1; color: #ffb6c1;
text-decoration: none; font-family: 'Orbitron', sans-serif;
background: rgba(0,0,0,0.9); cursor: pointer; transition: 0.3s;
}

.tab:hover {
background: #ffb6c1; color: #000; box-shadow: 0 0 20px #ffb6c1;
}

/* --- SECTIONS --- */
.section-container {
padding: 80px 20px; max-width: 1000px; margin: 100px auto;
background: rgba(0, 0, 0, 0.85); border: 2px solid rgba(255, 0, 255, 0.5);
position: relative; z-index: 1000;
box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
}

footer {
padding: 100px; color: #fff; font-family: 'Orbitron';
font-size: 20px; text-shadow: 0 0 10px #ff00ff;
}
</style>
</head>
<body>

<div class="doodle heart-top">♡</div>
<div class="doodle smile-bottom">ツ</div>
<div class="doodle star-mid">★</div>
<div class="doodle heart-mid">♡</div>

<div class="corner-swirl tl"></div>
<div class="corner-swirl br"></div>

<div class="header-bar">THEGIRLZ.INC // DOODLE_HQ // 2026</div>

<h1 class="brand-title">THE GIRLZ</h1>

<nav class="nav-tabs">
<a href="#hair" class="tab">HAIR</a>
<a href="#nails" class="tab">NAILS</a>
<a href="#lashes" class="tab">LASHES</a>
</nav>

<div id="hair" class="section-container">
<h2 style="font-family:'Sedgwick Ave Display'; font-size: 60px;">HAIR</h2>
<p>Loading the Archive... ♡</p>
</div>

<div id="nails" class="section-container">
<h2 style="font-family:'Sedgwick Ave Display'; font-size: 60px;">NAILS</h2>
<p>Loading the Archive... ★</p>
</div>

<footer>
★ ALL RIGHTS RESERVED // THEGIRLZ.INC ★
</footer>

</body>
</html>
