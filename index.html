
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>thegirlz.inc | Official</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Syne:wght@800&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
background-color: #050505;
background-image:
url('https://www.transparenttextures.com/patterns/stardust.png'),
radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.15) 0%, transparent 45%),
radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15) 0%, transparent 45%);
background-attachment: fixed;
color: #ffb6c1;
text-align: center;
font-family: 'Syne', sans-serif;
scroll-behavior: smooth;
overflow-x: hidden;
}

/* Side Menu Styling */
.side-nav {
height: 100%;
width: 0;
position: fixed;
z-index: 2000;
top: 0;
right: 0;
background-color: rgba(0, 0, 0, 0.95);
border-left: 2px solid #ff00ff;
overflow-x: hidden;
transition: 0.5s;
padding-top: 60px;
text-align: left;
}

.side-nav a {
padding: 15px 30px;
text-decoration: none;
font-size: 20px;
color: #fff;
display: block;
font-family: 'Orbitron', sans-serif;
transition: 0.3s;
border-bottom: 1px solid #333;
}

.side-nav a:hover {
color: #00ffff;
padding-left: 45px;
text-shadow: 0 0 10px #00ffff;
}

.closebtn {
position: absolute;
top: 0;
right: 25px;
font-size: 36px !important;
border: none !important;
}

.header-bar {
background: linear-gradient(90deg, #ff00ff, #00ffff);
padding: 10px;
font-family: 'Orbitron', sans-serif;
font-size: 11px;
color: #000;
text-transform: uppercase;
letter-spacing: 5px;
position: sticky;
top: 0;
z-index: 1000;
}

/* Tagged Spray Paint Title */
.brand-title {
font-family: 'Sedgwick Ave Display', cursive; /* Spray paint font */
font-size: clamp(70px, 15vw, 140px);
color: #fff;
margin-top: 60px;
margin-bottom: 10px;
text-transform: uppercase;
letter-spacing: 2px;
/* Fuzzy Spray Shadow */
text-shadow:
3px 3px 0px #ff00ff,
-2px -2px 10px #fff,
0 0 25px #ff00ff,
0 0 50px rgba(255, 0, 255, 0.5);
}

.nav-tabs {
display: flex;
justify-content: center;
gap: 15px;
margin-bottom: 60px;
}

.tab {
padding: 10px 20px;
border: 1px solid #ffb6c1;
color: #ffb6c1;
text-decoration: none;
font-family: 'Orbitron', sans-serif;
font-size: 14px;
background: rgba(0,0,0,0.8);
cursor: pointer;
}

.tab:hover {
background: #fff;
color: #000;
box-shadow: 0 0 15px #00ffff;
}

/* Service Sections */
.section-container {
padding: 80px 20px;
max-width: 1100px;
margin: 0 auto;
}

.service-header {
font-family: 'Sedgwick Ave Display', cursive;
font-size: 60px;
color: #fff;
text-shadow: 0 0 15px #00ffff;
margin-bottom: 20px;
}

.portfolio-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 20px;
}

.photo-card {
aspect-ratio: 1/1;
background: #111;
border: 2px solid #222;
display: flex;
align-items: center;
justify-content: center;
background-image: repeating-linear-gradient(45deg, #000 0, #000 10px, #0a0a0a 10px, #0a0a0a 20px);
font-family: 'Orbitron', sans-serif;
font-size: 10px;
opacity: 0.7;
}

footer {
padding: 100px 20px;
font-family: 'Orbitron', sans-serif;
font-size: 16px;
color: #fff; /* High Vis White */
text-transform: uppercase;
letter-spacing: 5px;
text-shadow: 0 0 10px #ff00ff;
}
</style>
</head>
<body>

<div id="contactMenu" class="side-nav">
<a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
<a href="mailto:official@thegirlz.inc">EMAIL</a>
<a href="#">US! (ABOUT)</a>
<a href="#">MEMBERS</a>
<a href="#">BOOKINGS</a>
</div>

<div class="header-bar">THEGIRLZ.INC // HQ // SYSTEM_v3.0</div>

<h1 class="brand-title">THE GIRLZ</h1>

<nav class="nav-tabs">
<a href="#hair" class="tab">HAIR</a>
<a href="#nails" class="tab">NAILS</a>
<a href="#lashes" class="tab">LASHES</a>
<span class="tab" onclick="openNav()">CONTACT US</span>
</nav>

<div id="hair" class="section-container">
<h2 class="service-header">HAIR</h2>
<div class="portfolio-grid">
<div class="photo-card">HAIR_ARCHIVE_01</div>
<div class="photo-card">HAIR_ARCHIVE_02</div>
</div>
</div>

<div id="nails" class="section-container">
<h2 class="service-header">NAILS</h2>
<div class="portfolio-grid">
<div class="photo-card">NAIL_ARCHIVE_01</div>
<div class="photo-card">NAIL_ARCHIVE_02</div>
</div>
</div>

<div id="lashes" class="section-container">
<h2 class="service-header">LASHES</h2>
<div class="portfolio-grid">
<div class="photo-card">LASH_ARCHIVE_01</div>
<div class="photo-card">LASH_ARCHIVE_02</div>
</div>
</div>

<footer>
★ ALL RIGHTS RESERVED // THEGIRLZ.INC ★
</footer>

<script>
function openNav() {
document.getElementById("contactMenu").style.width = "300px";
}
function closeNav() {
document.getElementById("contactMenu").style.width = "0";
}
</script>

</body>
</html>
